<text x="182.0" y="448.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="start">Personal part of every story, spoken as segment 0. Modelled as never cached (0%): conservative.</text>
<text x="182.0" y="466.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="start">Harness: prefix-text repeats gave audio hits 5/132 when body audio was evicted.</text>
<rect x="24.0" y="492.0" width="804.0" height="76.0" rx="8" fill="#FFE3DB" stroke="#B23A1E" stroke-width="1.4"/>
<text x="36.0" y="516.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#131A1D" text-anchor="start">Read this honestly</text>
<text x="36.0" y="536.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="start">These counters come from ONE fixture route (WTC walk) replayed 36 times in one process. A repeated route is the best case for any cache.</text>
<text x="36.0" y="551.9" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="start">They prove the mechanism works; they say nothing about how often real users share a place, angle, guide and budget bucket.</text>
<text x="24.0" y="584.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="start">Store of record: Postgres 16 (sessions, journey memory, stories, events, cost ledger, audit).</text>
<text x="24.0" y="599.3" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="start">Hot state and rate limits: Redis 7. Redis loss = explicit reduced mode, not outage.</text>
<text x="24.0" y="630.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">Source: benchmark/acceptance/results.json cacheRates (MEASURED-harness, 36 sessions per phase); DECISIONS.md D-011, D-018. Google</text>
<text x="24.0" y="644.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">Places results are never cached (terms).</text>
