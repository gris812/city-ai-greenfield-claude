<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" role="img" aria-label="Web, mobile and admin surface relationship"><title>Web, mobile and admin surface relationship</title><desc>How the surfaces share one backend and one decision core</desc><defs><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5A53"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5A53"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#726C63"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#726C63"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#726C63"/></marker></defs><rect width="840" height="480" fill="#F7F4EE"/>
<text x="24.0" y="34.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#131A1D" text-anchor="start">Surfaces: web, mobile, admin</text>
<text x="24.0" y="56.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#5F5A53" text-anchor="start">One backend and one decision core; each surface is a sensor, a renderer and an audio player</text>
<rect x="24.0" y="100.0" width="250.0" height="130.0" rx="10" fill="#DDF1E6" stroke="#1A6B45" stroke-width="1.6"/>
<text x="149.0" y="140.3" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#131A1D" text-anchor="middle">apps/web (Next.js)</text>
<text x="149.0" y="157.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">route group (site): public website</text>
<text x="149.0" y="172.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">route group (app): WebApp / PWA</text>
<text x="149.0" y="186.9" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">route group (admin): operations console</text>
<text x="149.0" y="201.9" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">built, 5/5 smoke e2e, locally only</text>
<rect x="566.0" y="100.0" width="250.0" height="130.0" rx="10" fill="#FCEBC7" stroke="#8F5B00" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="691.0" y="140.3" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#131A1D" text-anchor="middle">apps/mobile (Expo)</text>
<text x="691.0" y="157.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">Explore + Drive HUD, History, Settings</text>
<text x="691.0" y="172.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">hidden Operator entry (long-press version)</text>
<text x="691.0" y="186.9" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">native location, background audio</text>
<text x="691.0" y="201.9" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5F5A53" text-anchor="middle">bundles build; no device run</text>
<rect x="24.0" y="290.0" width="792.0" height="74.0" rx="12" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="2"/>
<text x="420.0" y="316.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#131A1D" text-anchor="middle">Telvey API  ·  one contract (docs/API.md), one WebSocket per session, REST fallback</text>
<text x="420.0" y="338.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5F5A53" text-anchor="middle">ContextFrames up, Directives down (play, stop_audio, map, listen, say, navigate_handoff, state, card)</text>
<text x="420.0" y="355.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#5F5A53" text-anchor="middle">server-side ranking, timing, safety, budgets and resume; clients never choose targets</text>
<path d="M149.0,230.0 L149.0,290.0" fill="none" stroke="#5F5A53" stroke-width="1.6" marker-end="url(#ah1)" marker-start="url(#ah1)" stroke-linejoin="round"/>
<path d="M691.0,230.0 L691.0,290.0" fill="none" stroke="#5F5A53" stroke-width="1.6" marker-end="url(#ah2)" marker-start="url(#ah2)" stroke-linejoin="round"/>
<rect x="298.0" y="100.0" width="244.0" height="56.0" rx="10" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="1.6"/>
<text x="420.0" y="125.6" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#131A1D" text-anchor="middle">packages/client</text>
<text x="420.0" y="141.5" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5F5A53" text-anchor="middle">LocalEngine, channel, sequencer, i18n</text>
<rect x="298.0" y="172.0" width="244.0" height="58.0" rx="10" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="1.6"/>
<text x="420.0" y="198.4" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#131A1D" text-anchor="middle">packages/core (in the browser too)</text>
<text x="420.0" y="214.3" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5F5A53" text-anchor="middle">offline demo runs the real pipeline</text>
<path d="M274.0,128.0 L298.0,128.0" fill="none" stroke="#726C63" stroke-width="1.2" marker-end="url(#ah3)" stroke-linejoin="round"/>
<path d="M542.0,128.0 L566.0,128.0" fill="none" stroke="#726C63" stroke-width="1.2" marker-end="url(#ah4)" stroke-linejoin="round"/>
<path d="M420.0,156.0 L420.0,172.0" fill="none" stroke="#726C63" stroke-width="1.2" marker-end="url(#ah5)" stroke-linejoin="round"/>
<rect x="24.0" y="384.0" width="792.0" height="64.0" rx="10" fill="#FFFFFF" stroke="#E2DBCF" stroke-width="1.2"/>
<text x="40.0" y="406.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">Admin access: web console uses WebAuthn passkeys (first owner bootstrapped by a one-time server CLI code). A signed-in admin</text>
<text x="40.0" y="422.8" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">issues a 5-minute pairing QR; the phone redeems it for a revocable, role-scoped device token kept in secure storage. No static</text>
<text x="40.0" y="439.6" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">password or secret ships in any client. Every admin action is audited.</text>
<text x="24.0" y="468.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">Source: docs/API.md auth model, docs/MOBILE.md §1, DECISIONS.md D-002, D-013. Mobile admin has not been run on a device.</text>
</svg>