<rect x="24.0" y="372.0" width="792.0" height="108.0" rx="10" fill="#FFFFFF" stroke="#E2DBCF" stroke-width="1.2"/>
<text x="40.0" y="396.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#131A1D" text-anchor="start">Why this shape matters commercially</text>
<text x="40.0" y="416.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.1650868328624" font-weight="500" fill="#5F5A53" text-anchor="start">1. The cacheable unit is the context-free story body: one LLM + TTS spend can serve many listeners (production hit rate NOT YET MEASURED).</text>
<text x="40.0" y="431.6" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.1650868328624" font-weight="500" fill="#5F5A53" text-anchor="start">2. A model outage degrades to template text for the same target; the model never picks the place, the timing or the length.</text>
<text x="40.0" y="447.3" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.1650868328624" font-weight="500" fill="#5F5A53" text-anchor="start">3. Every spoken sentence is checked against evidence before it is voiced, so the failure mode is bland, not invented.</text>
<rect x="24.0" y="496.0" width="18.0" height="14.0" rx="3" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="1.4"/>
<text x="49.0" y="507.5" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">Deterministic code</text>
<rect x="172.7" y="496.0" width="18.0" height="14.0" rx="3" fill="#FFE3DB" stroke="#B23A1E" stroke-width="1.4"/>
<text x="197.7" y="507.5" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">Generative model (paid)</text>
<rect x="349.7" y="496.0" width="18.0" height="14.0" rx="3" fill="#EFEAE1" stroke="#5F5A53" stroke-width="1.4"/>
<text x="374.7" y="507.5" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">Cache / store</text>
<text x="24.0" y="522.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">Source: DECISIONS.md D-003, D-009, D-018; packages/core (brief, story-primitive, grounding, segment). TTS is a generative provider call even</text>
<text x="24.0" y="536.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">though text is fixed.</text>
