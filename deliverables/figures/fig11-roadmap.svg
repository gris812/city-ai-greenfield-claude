<text x="212.0" y="457.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.3" font-weight="500" fill="#5F5A53" text-anchor="start">Proves people use it twice and that the shared cache and tiered voice bring cost under the plan price.</text>
<text x="212.0" y="471.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.3" font-weight="500" fill="#5F5A53" text-anchor="start">Output: first real hit rate, retention, conversion signal.</text>
<text x="40.0" y="492.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="700" fill="#131A1D" text-anchor="start">Scale (after phase 4)</text>
<text x="212.0" y="492.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.3" font-weight="500" fill="#5F5A53" text-anchor="start">Only if the beta clears the cost floor and a channel (stores, OEM, fleet, DMO) is identified. Not proposed</text>
<text x="212.0" y="506.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.3" font-weight="500" fill="#5F5A53" text-anchor="start">on current evidence.</text>
<text x="24.0" y="544.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">Source: this report's synthesis of docs/STATUS.md blockers (D-010, D-016) and benchmark gaps. Durations are planning assumptions, not</text>
<text x="24.0" y="558.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">commitments; no dates are promised.</text>
