<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 570" width="840" height="570" role="img" aria-label="Conversation, interruption and resume states"><title>Conversation, interruption and resume states</title><desc>State machine for narration, listening, answering and resume decisions</desc><defs><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5A53"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5A53"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5A53"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5A53"/></marker><marker id="ah5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A6B45"/></marker><marker id="ah6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5A53"/></marker></defs><rect width="840" height="570" fill="#F7F4EE"/>
<text x="24.0" y="34.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#131A1D" text-anchor="start">Conversation, interruption and resume</text>
<text x="24.0" y="56.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#5F5A53" text-anchor="start">Barge-in stops audio first; the resume decision is a deterministic policy, not a model call</text>
<rect x="24.0" y="110.0" width="150.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#A39D93" stroke-width="1.6"/>
<text x="99.0" y="139.7" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#131A1D" text-anchor="middle">Quiet</text>
<text x="99.0" y="156.8" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">silence policy holds;</text>
<text x="99.0" y="172.2" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">nothing worth saying</text>
<rect x="300.0" y="110.0" width="210.0" height="80.0" rx="10" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="1.6"/>
<text x="405.0" y="139.7" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#131A1D" text-anchor="middle">Telling story</text>
<text x="405.0" y="156.8" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">segment k of n playing</text>
<text x="405.0" y="172.2" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">pause / OS call: held until tap</text>
<rect x="640.0" y="110.0" width="176.0" height="80.0" rx="10" fill="#DDF1E6" stroke="#1A6B45" stroke-width="1.6"/>
<text x="728.0" y="139.7" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#131A1D" text-anchor="middle">Listening</text>
<text x="728.0" y="156.8" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">opened by a user press;</text>
<text x="728.0" y="172.2" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">never auto while driving</text>
<rect x="24.0" y="270.0" width="150.0" height="80.0" rx="10" fill="#FCEBC7" stroke="#8F5B00" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="99.0" y="301.1" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#131A1D" text-anchor="middle">Abandoned</text>
<text x="99.0" y="316.7" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="10.737717233435168" font-weight="500" fill="#5F5A53" text-anchor="middle">passed, stale, superseded,</text>
<text x="99.0" y="330.6" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="10.737717233435168" font-weight="500" fill="#5F5A53" text-anchor="middle">nearly done, topic change</text>
<rect x="300.0" y="270.0" width="210.0" height="80.0" rx="10" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="1.6"/>
<text x="405.0" y="299.7" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#131A1D" text-anchor="middle">Resume decision</text>
<text x="405.0" y="316.8" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">ResumePolicy:</text>
<text x="405.0" y="332.2" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">resume | abandon</text>
<rect x="640.0" y="270.0" width="176.0" height="80.0" rx="10" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="1.6"/>
<text x="728.0" y="299.7" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#131A1D" text-anchor="middle">Answering</text>
<text x="728.0" y="316.8" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">intent, tool (nearby),</text>
<text x="728.0" y="332.2" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.8" font-weight="500" fill="#5F5A53" text-anchor="middle">grounded sentence</text>
<path d="M174.0,150.0 L300.0,150.0" fill="none" stroke="#5F5A53" stroke-width="1.7" marker-end="url(#ah1)" stroke-linejoin="round"/>
<text x="237.0" y="141.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="middle">moment approved</text>
<path d="M510.0,150.0 L640.0,150.0" fill="none" stroke="#5F5A53" stroke-width="1.7" marker-end="url(#ah2)" stroke-linejoin="round"/>
<text x="575.0" y="141.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="middle">mic / barge-in</text>
<text x="575.0" y="176.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B23A1E" text-anchor="middle">audio stops first</text>
<path d="M728.0,190.0 L728.0,270.0" fill="none" stroke="#5F5A53" stroke-width="1.7" marker-end="url(#ah3)" stroke-linejoin="round"/>
<text x="738.0" y="235.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">utterance</text>
<path d="M640.0,310.0 L510.0,310.0" fill="none" stroke="#5F5A53" stroke-width="1.7" marker-end="url(#ah4)" stroke-linejoin="round"/>
<text x="575.0" y="301.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="middle">answer finished</text>
<path d="M405.0,270.0 L405.0,190.0" fill="none" stroke="#1A6B45" stroke-width="2" marker-end="url(#ah5)" stroke-linejoin="round"/>
<text x="415.0" y="235.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#1A6B45" text-anchor="start">resume at segment k</text>
<path d="M300.0,310.0 L174.0,310.0" fill="none" stroke="#5F5A53" stroke-width="1.7" marker-end="url(#ah6)" stroke-linejoin="round"/>
<text x="237.0" y="301.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="middle">abandon</text>
<rect x="24.0" y="376.0" width="792.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#E2DBCF" stroke-width="1.2"/>
<text x="40.0" y="400.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#131A1D" text-anchor="start">Deterministic rules behind the arrows (packages/core/src/resume.ts, safety.ts)</text>
<text x="40.0" y="420.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="10.245253417177743" font-weight="500" fill="#5F5A53" text-anchor="start">Resume restarts at the START of the interrupted segment (a sentence group); a bridge phrase is added if the pause exceeded 8 s or an answer was spoken.</text>
<text x="40.0" y="434.3" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="10.245253417177743" font-weight="500" fill="#5F5A53" text-anchor="start">Abandon when: a newer plan exists; the target is passed (driving: more than 50 m behind; walking: more than 400 m away); the pause is stale</text>
<text x="40.0" y="448.7" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="10.245253417177743" font-weight="500" fill="#5F5A53" text-anchor="start">(walking 3 min, driving 90 s); or 85% of the segments were already told. An explicit topic change never auto-resumes the old story (acceptance C3).</text>
<text x="40.0" y="463.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="10.245253417177743" font-weight="500" fill="#5F5A53" text-anchor="start">If listening closes with no utterance, the same policy decides on the next tick.</text>
<rect x="24.0" y="504.0" width="18.0" height="14.0" rx="3" fill="#EEF6F7" stroke="#0F4C5C" stroke-width="1.4"/>
<text x="49.0" y="515.5" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">Server policy state</text>
<rect x="174.2" y="504.0" width="18.0" height="14.0" rx="3" fill="#DDF1E6" stroke="#1A6B45" stroke-width="1.4"/>
<text x="199.2" y="515.5" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">User-initiated</text>
<rect x="294.6" y="504.0" width="18.0" height="14.0" rx="3" fill="#FCEBC7" stroke="#8F5B00" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="319.6" y="515.5" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5F5A53" text-anchor="start">Terminal</text>
<text x="24.0" y="558.0" font-family="Onest, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#726C63" text-anchor="start">Source: DECISIONS.md D-008/D-009; acceptance C1, C3, E3. Exercised in tests with fake providers; not yet on a physical device.</text>
</svg>